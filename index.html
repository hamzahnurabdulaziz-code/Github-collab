<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Tamu - Kolaborasi GitHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #08090c;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* CONTAINER UTAMA / WRAPPER TABEL KANAN */
        .guest-section {
            width: 100%;
            max-width: 680px;
            background: rgba(15, 17, 23, 0.85);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 16px;
            padding: 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 
                        0 0 25px rgba(225, 29, 72, 0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .guest-section:hover {
            border-color: rgba(225, 29, 72, 0.6);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 
                        0 0 35px rgba(225, 29, 72, 0.22);
        }

        /* HEADER SECTION */
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header-title h2 {
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
            margin-top: 6px;
        }

        .badge-red {
            background: rgba(225, 29, 72, 0.15);
            color: #ff4d6d;
            border: 1px solid rgba(225, 29, 72, 0.35);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-block;
        }

        .count-tag {
            font-size: 13px;
            color: #94a3b8;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* STYLING TABEL MODERN */
        .table-wrapper {
            overflow-x: auto;
        }

        .modern-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            text-align: left;
        }

        .modern-table th {
            color: #64748b;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 0 16px 8px;
            font-weight: 600;
        }

        .modern-table tbody tr {
            background: #111319;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            border-radius: 10px;
        }

        .modern-table tbody tr:hover {
            background: #181b24;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(225, 29, 72, 0.18);
        }

        .modern-table td {
            padding: 16px;
            font-size: 14px;
            color: #cbd5e1;
        }

        .modern-table td:first-child {
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            font-weight: 700;
            color: #ff4d6d;
            width: 50px;
        }

        .modern-table td:last-child {
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* USER & AVATAR CELL */
        .user-cell {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #f8fafc;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #e11d48, #881337);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            box-shadow: 0 0 12px rgba(225, 29, 72, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .role-text {
            color: #94a3b8;
            font-size: 13px;
        }

        /* BADGES STATUS PULL REQUEST */
        .status-pill {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .status-pill.merged {
            background: rgba(34, 197, 94, 0.12);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .status-pill.review {
            background: rgba(234, 179, 8, 0.12);
            color: #fde047;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }

        .status-pill.open {
            background: rgba(225, 29, 72, 0.15);
            color: #ff4d6d;
            border: 1px solid rgba(225, 29, 72, 0.35);
        }
    </style>
</head>
<body>

    <!-- CONTAINER TABEL TAMU (BAGIAN KANAN) -->
    <div class="guest-section">
        <div class="table-header">
            <div class="header-title">
                <span class="badge-red">Guest Contributor</span>
                <h2>Tabel Anggota Tamu</h2>
            </div>
            <span class="count-tag">3 Kontributor</span>
        </div>

        <div class="table-wrapper">
            <table class="modern-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Tamu</th>
                        <th>Peran / Tugas</th>
                        <th>Status PR</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>01</td>
                        <td>
                            <div class="user-cell">
                                <span class="avatar">T1</span>
                                Asep Supriatna
                            </div>
                        </td>
                        <td><span class="role-text">Frontend Contributor</span></td>
                        <td><span class="status-pill merged">Merged</span></td>
                    </tr>
                    <tr>
                        <td>02</td>
                        <td>
                            <div class="user-cell">
                                <span class="avatar">T2</span>
                                Budi Santoso
                            </div>
                        </td>
                        <td><span class="role-text">UI/UX Designer</span></td>
                        <td><span class="status-pill review">In Review</span></td>
                    </tr>
                    <tr>
                        <td>03</td>
                        <td>
                            <div class="user-cell">
                                <span class="avatar">T3</span>
                                Citra Lestari
                            </div>
                        </td>
                        <td><span class="role-text">Technical Writer</span></td>
                        <td><span class="status-pill open">Open</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
